               ga.async = true;
               ga.src =

               d.body.appendChild(ga);

               function gtag() {
                  globalThis.dataLayer.push(arguments);
               }
               gtag("js", new Date());
               gtag("config", "G-PFFMG7D8DP");
            });
         }
